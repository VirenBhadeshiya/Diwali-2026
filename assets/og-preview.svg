<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1A0D18"/>
      <stop offset="50%" stop-color="#0F0810"/>
      <stop offset="100%" stop-color="#060408"/>
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF0D7"/>
      <stop offset="25%" stop-color="#DFBA73"/>
      <stop offset="50%" stop-color="#FFF5D6"/>
      <stop offset="75%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#FAF0D7"/>
    </linearGradient>
    <radialGradient id="diya-flame" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="25%" stop-color="#FFC107"/>
      <stop offset="65%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB300" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF8F00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- Ornate Border -->
  <rect x="30" y="30" width="1140" height="570" rx="16" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="42" y="42" width="1116" height="546" rx="12" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="6 4" stroke-opacity="0.3"/>

  <!-- Diya Motif -->
  <circle cx="600" cy="180" r="100" fill="url(#aura)"/>
  <!-- Flame -->
  <path d="M600 110 C600 110 570 155 570 180 C570 196 583 210 600 210 C617 210 630 196 630 180 C630 155 600 110 600 110 Z" fill="url(#diya-flame)"/>
  <!-- Diya Bowl -->
  <path d="M540 200 C545 230 570 248 600 248 C630 248 655 230 660 200 C630 212 570 212 540 200 Z" fill="url(#gold-grad)"/>

  <!-- Typography -->
  <text x="600" y="305" text-anchor="middle" font-family="'Cinzel', serif" font-size="22" font-weight="600" letter-spacing="8" fill="#DFBA73">
    FESTIVE CELEBRATION 2026
  </text>
  <text x="600" y="365" text-anchor="middle" font-family="'Cinzel Decorative', 'Cinzel', serif" font-size="52" font-weight="700" letter-spacing="4" fill="url(#gold-grad)">
    HAPPY DIWALI
  </text>
  
  <!-- Divider -->
  <line x1="420" y1="400" x2="780" y2="400" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.6"/>
  <circle cx="600" cy="400" r="4" fill="#FAF0D7"/>

  <text x="600" y="465" text-anchor="middle" font-family="'Cinzel', serif" font-size="46" font-weight="700" letter-spacing="6" fill="#FAF0D7">
    NANDITA JAYSWAL
  </text>
  
  <text x="600" y="525" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="19" font-weight="300" letter-spacing="2" fill="#E0D2B8">
    Wishing you endless joy, bright moments, and wonderful friendship.
  </text>
</svg>

